{% extends 'base.html' %}
{% block content %}
<div class="edit-profile-container">
  <h1>Edit Your Profile</h1>

  <form method="post" enctype="multipart/form-data" class="edit-profile-form">
        <!-- Role -->
    <label for="role">Register as</label>
    <select id="role" name="role" required>
      <option value="student">Student</option>
      <option value="faculty">Faculty</option>
    </select>
    
    <!-- Name -->
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" value="{{ user.name }}" required>

    <!-- Email (readonly) -->
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ user.email }}" readonly>

    <!-- Phone -->
    <label for="phone">Phone Number</label>
    <input type="text" id="phone" name="phone" value="{{ user.phone or '' }}">

    <!-- Age -->
    <label for="age">Age</label>
    <input type="number" id="age" name="age" value="{{ user.age or '' }}">

    <!-- Gender -->
    <label for="gender">Gender</label>
    <select id="gender" name="gender">
      <option value="">Select</option>
      <option value="Male" {% if user.gender == "Male" %}selected{% endif %}>Male</option>
      <option value="Female" {% if user.gender == "Female" %}selected{% endif %}>Female</option>
      <option value="Other" {% if user.gender == "Other" %}selected{% endif %}>Other</option>
    </select>

    <!-- Address -->
    <label for="address">Address</label>
    <textarea id="address" name="address" rows="3" placeholder="Enter your address">{{ user.address or '' }}</textarea>

    <!-- Profile Picture -->
    <!-- <label for="profile_pic">Change Profile Picture</label>
    {% if user.profile_pic %}
      <img src="{{ user.profile_pic }}" alt="Profile Picture" class="profile-pic-preview">
    {% endif %}
    <input type="file" id="profile_pic" name="profile_pic" accept="image/*"> -->

    <button type="submit" class="btn save-btn">Save Changes</button>
    <a href="{{ url_for('profile') }}" class="btn cancel-btn">Cancel</a>
  </form>
</div>
{% endblock %}
