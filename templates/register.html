{% extends 'base.html' %}
{% block content %}
<div class="register-container">
  <h1 class="form-title">Create Your Account</h1>

  <form method="post" enctype="multipart/form-data" class="register-form">
     <!-- Role -->
    <label for="role">Register as</label>
    <select id="role" name="role" required>
      <option value="student">Student</option>
      <option value="faculty">Faculty</option>
    </select>

    <!-- Name -->
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <!-- Gender -->
    <section id="Gen" style="margin-top: 2rem; margin-bottom: 2rem;">
    <label for="gender">Gender</label>
    <select id="gender" name="gender" required>
      <option value="" disabled selected>Select your gender</option>
      <option value="female">Female</option>
      <option value="male">Male</option>
      <option value="other">Other</option>
    </select>
    </section>


    <!-- Email -->
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Enter your email address" required>

    <!-- Password -->
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Create a strong password" required>

    <!-- Phone -->
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

    <!-- Age -->
    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="10" max="100" placeholder="Enter your age">

    <!-- Address -->
    <label for="address">Address</label>
     <input id="address" name="address" placeholder="Enter your full address">

    <!-- Profile Picture
    <label for="profile_pic">Upload Profile Picture</label>
    <input type="file" id="profile_pic" name="profile_pic" accept="image/*"> -->

    <button class="btn" type="submit">Register</button>
  </form>
</div>
{% endblock %}
